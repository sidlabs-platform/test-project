# =============================================================================
# CD Workflow — equivalent of pipelines/cd-deploy.yml
# Multi-environment deployment (Dev → Staging → Production)
# Triggered after CI workflow completes on main
# =============================================================================
name: CD - Deploy

on:
  workflow_run:
    workflows: ['CI - Build & Test']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write       # For Azure OIDC login (recommended over secrets)

env:
  APP_NAME: 'task-board-webapp'
  AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ─── Deploy to Dev ─────────────────────────────────────────────────────
  deploy-dev:
    name: '🟢 Deploy to Dev'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: dev
      url: https://${{ env.APP_NAME }}-dev.azurewebsites.net

    steps:
      - name: '📥 Download Artifact'
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./drop
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🔑 Azure Login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: '🚀 Deploy to Dev'
        uses: azure/webapps-deploy@v3
        with:
          app-name: '${{ env.APP_NAME }}-dev'
          package: ./drop
          startup-command: 'npm start'

      - name: '🏥 Smoke Test'
        run: |
          APP_URL="https://${{ env.APP_NAME }}-dev.azurewebsites.net"
          echo "Running smoke tests against $APP_URL"

          # Health check with retries
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
            if [ "$HTTP_CODE" -eq 200 ]; then break; fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Health check passed"

          # API check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/tasks")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ API check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ API check passed"
          echo "🎉 All smoke tests passed!"

  # ─── Deploy to Staging ─────────────────────────────────────────────────
  deploy-staging:
    name: '🟡 Deploy to Staging'
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging
      url: https://${{ env.APP_NAME }}-staging.azurewebsites.net

    steps:
      - name: '📥 Download Artifact'
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./drop
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🔑 Azure Login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: '🚀 Deploy to Staging'
        uses: azure/webapps-deploy@v3
        with:
          app-name: '${{ env.APP_NAME }}-staging'
          package: ./drop
          startup-command: 'npm start'

      - name: '🏥 Smoke Test'
        run: |
          APP_URL="https://${{ env.APP_NAME }}-staging.azurewebsites.net"
          echo "Running smoke tests against $APP_URL"

          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
            if [ "$HTTP_CODE" -eq 200 ]; then break; fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Health check passed"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/tasks")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ API check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ API check passed"
          echo "🎉 All smoke tests passed!"

  # ─── Deploy to Production ──────────────────────────────────────────────
  deploy-production:
    name: '🔴 Deploy to Production'
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://${{ env.APP_NAME }}.azurewebsites.net

    steps:
      - name: '📥 Download Artifact'
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./drop
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🔑 Azure Login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: '🚀 Deploy to Production'
        uses: azure/webapps-deploy@v3
        with:
          app-name: '${{ env.APP_NAME }}'
          package: ./drop
          startup-command: 'npm start'

      - name: '🏥 Smoke Test'
        run: |
          APP_URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "Running smoke tests against $APP_URL"

          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
            if [ "$HTTP_CODE" -eq 200 ]; then break; fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Health check passed"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/tasks")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ API check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ API check passed"
          echo "🎉 All smoke tests passed!"

      - name: '🚨 Alert on Failure'
        if: failure()
        run: echo "⚠️ Production deployment failed! Investigate immediately."
